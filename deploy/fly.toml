app = "dsh-remote"
primary_region = "iad"

[build]
  dockerfile = "deploy/Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "3080"
  DSH_HOME = "/data/dsh-home"

[http_service]
  internal_port = 3080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2

[mounts]
  source = "dsh_data"
  destination = "/data"
